SchemaVersion: 1.0

Triggers:
  - Type: PUSH
    Branches:
      - main
Actions:
  BuildDocker:
    Identifier: aws/build@v1
    Environment:
      Connections:
        - Role: get_ecr_image_codecatalyst_role
          Name: "522246528012"
      Name: ecs_pipeline_bluegree
    Inputs:
      Variables:
        - Name: REPOSITORY_URI
          Value: 522246528012.dkr.ecr.us-east-1.amazonaws.com
        - Name: IMAGE_TAG
          Value: ${WorkflowSource.CommitId}
        - Name: stage
          Value: dev
        - Name: project_name
          Value: project-ecs
        - Name: container_name
          Value: dev-project-container-app
        - Name: path_to_taskdef
          Value: modules/ecs-service/container_definitions/taskdef.json
      Sources:
        - WorkflowSource
    Configuration:
      Steps:
        #pre_build:
        - Run: echo Logging in to Amazon ECR...
        - Run: aws ecr get-login-password --region us-east-1 | docker login --username AWS
            --password-stdin $REPOSITORY_URI/$stage-$project_name-registry
        #build:
        - Run: echo Build started on `date`
        - Run: echo Building the Docker image...
        - Run: docker build -t $REPOSITORY_URI/$stage-$project_name-registry:latest ./app
        - Run: docker tag $REPOSITORY_URI/$stage-$project_name-registry:latest
            $REPOSITORY_URI/$stage-$project_name-registry:$IMAGE_TAG
        #post_build:
        - Run: echo Build completed on `date`
        - Run: echo Pushing the Docker images...
        - Run: docker push $REPOSITORY_URI/$stage-$project_name-registry:latest
        - Run: docker push $REPOSITORY_URI/$stage-$project_name-registry:$IMAGE_TAG
    Outputs:
      Variables:
        - REPOSITORY_URI
        - IMAGE_TAG
        - stage
        - project_name
        - container_name
        - path_to_taskdef
    Compute:
      Type: EC2
      Fleet: Linux.x86-64.Large

  RenderTaskDef:
    Identifier: aws/ecs-render-task-definition@v1
    Configuration:
      image: ${BuildDocker.REPOSITORY_URI}/${BuildDocker.stage}-${BuildDocker.project_name}-registry:${BuildDocker.IMAGE_TAG}
      container-name: ${BuildDocker.container_name}
      task-definition: ${BuildDocker.path_to_taskdef}
    Compute:
      Type: EC2
      Fleet: Linux.x86-64.Large
    # The output variable is set to the name of the updated task definition file. 
    Outputs:
      Artifacts:
        - Name: TaskDefArtifact
          Files:
            - task-definition*
    DependsOn:
      - BuildDocker
    Inputs:
      Sources:
        - WorkflowSource

  DeployToECS:
    Identifier: aws/ecs-deploy@v1
    Configuration:
      force-new-deployment: "1"
      codedeploy-deployment-group: dev-project-ecs-service_deployment-group
      codedeploy-application: dev-project-ecs-service_app
      codedeploy-appspec: appspec.yml
      task-definition: ${RenderTaskDef.task-definition}
      service: dev-project-ecs-service
      cluster: dev-project-ecs-cluster
      region: us-east-1
    Compute:
      Type: EC2
      Fleet: Linux.x86-64.Large
    Environment:
      Connections:
        - Role: ecs_update_codecatalyst_role
          Name: "522246528012"
      Name: ecs_pipeline_bluegree
    DependsOn:
      - BuildDocker
      - RenderTaskDef
    #Input artifact contains the updated task definition file.
    Inputs:
      Artifacts:
        - TaskDefArtifact
      Sources: []
