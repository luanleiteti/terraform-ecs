SchemaVersion: 1.0
Actions:
  PushToAmazonECR_26:
    # Identifies the action. Do not modify this value.
    Identifier: codecatalyst-labs/push-to-ecr@v1.0.3
    Environment:
      Connections:
        - Role: get_ecr_image_codecatalyst_role
          Name: "522246528012"
      Name: ecs_pipeline_bluegree
    Inputs:
      Sources:
        - WorkflowSource
    Compute:
      Type: EC2
    Configuration:
      Tags: ${WorkflowSource.CommitId}
      RepositoryName: dev-project-ecs-registry
      AWSRegion: us-east-1
      DockerfileLocation: app/
      ImageTag: ${WorkflowSource.CommitId}
      PublicRepository: false
      EncryptionType: AES256
      ImageScanningConfiguration: true